name: Tests

# Runs the full test suite on every PR and every push to main. Needs no
# secrets or live infra — SERVICE_API_KEY is a fixed test constant set in
# tests/conftest.py, and every actual crawl is mocked at the
# src/crawler/wrapper boundary (see tests/test_scrape_routes.py). The one
# real, unmocked test is tests/test_chunker_pipeline.py, which exercises the
# real parser/chunker against inline sample HTML — no network call.
#
# requirements.txt does include crawl4ai/scrapling (the legacy crawler's
# real runtime dependencies), so `pip install` here is genuinely slow (a
# few minutes) — that's expected, not a workflow bug. Nothing in the test
# suite needs Playwright's actual browser binaries installed, since no test
# drives a real browser.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches Dockerfile's python:3.11-slim
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v
