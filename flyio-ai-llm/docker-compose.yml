version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: flyio-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: flyio-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flyio_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyio_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flyio-ai-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flyio-ai-llm
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=flyio_knowledge_base
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/flyio_ai
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:

