name: Tests

# Runs the full test suite on every PR and every push to main. Deliberately
# needs zero secrets/live infra to pass: the suite runs entirely against mock
# providers and a closed-loopback DATABASE_URL (see tests/conftest.py) — the
# same reason it can run here without provisioning Qdrant, Postgres, or an
# LLM API key as CI services. The 2 tests that hit the real Groq API
# self-skip via GROQ_API_KEY_FOR_TESTS being unset (see
# tests/test_llm_groq_provider.py) rather than failing.
#
# This does NOT catch every class of bug on its own — see Phase 0 of the
# FlyIO AI/LLM implementation plan: a prior startup crash passed the full
# suite for weeks because httpx's ASGITransport (used by the async_client
# fixture) never runs FastAPI's lifespan, so a bug only reachable from
# lifespan had no test surface until tests/test_logging_lifespan.py added
# one. CI enforces that no *known* regression slips back in; it doesn't
# replace live verification against real infra when that matters.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches Dockerfile's python:3.12-slim
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v
